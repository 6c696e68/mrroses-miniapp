<body class="min-h-screen text-[13px] antialiased pb-24">
  <div id="empty" class="hidden px-4 pt-12 text-center">
    <p class="text-lg font-semibold">ROSES</p>
    <p class="hint mt-2 leading-5">Open <span class="link">/app</span> in Telegram and tap a group.</p>
  </div>

  <div id="app" class="hidden">
    <header class="px-4 pt-3 pb-2">
      <div class="flex items-baseline justify-between gap-2">
        <h1 id="title" class="truncate text-[15px] font-semibold">Group</h1>
        <p id="chatId" class="hint shrink-0 text-[11px]"></p>
      </div>
      <p id="viewOnly" class="hidden mt-2 card px-3 py-2 text-[12px] leading-4">View only. Save from the private <b>Save settings</b> keyboard.</p>
    </header>

    <nav class="mx-4 mb-3 grid grid-cols-4 gap-0.5 rounded-lg bg-black/25 p-0.5 text-[12px] font-medium">
      <button data-tab="overview" class="tab is-on rounded-md py-1.5">Home</button>
      <button data-tab="shield" class="tab rounded-md py-1.5 hint">Locks</button>
      <button data-tab="people" class="tab rounded-md py-1.5 hint">People</button>
      <button data-tab="log" class="tab rounded-md py-1.5 hint">Log</button>
    </nav>

    <section data-panel="overview" class="panel px-4 space-y-2">
      <div class="card px-3 py-2.5">
        <div class="flex items-center justify-between gap-3">
          <p class="font-medium">Welcome</p>
          <button id="we" type="button" class="toggle" aria-pressed="false"></button>
        </div>
        <textarea id="wt" rows="2" placeholder="Hi {mention}, welcome to {chatname}."
          class="mt-2 w-full resize-none rounded-md bg-black/30 px-2.5 py-1.5 text-[13px] outline-none"></textarea>
        <p class="hint mt-1 text-[11px]">{mention} {first} {chatname} {count}</p>
      </div>
      <div class="card flex items-center justify-between gap-3 px-3 py-2.5">
        <p class="font-medium">Mute no @username</p>
        <button id="nu" type="button" class="toggle" aria-pressed="false"></button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <label class="card px-3 py-2.5">
          <span class="hint text-[11px]">Warn limit</span>
          <input id="wl" type="number" min="1" max="50" class="mt-0.5 w-full bg-transparent text-lg font-semibold outline-none">
        </label>
        <label class="card px-3 py-2.5">
          <span class="hint text-[11px]">Flood (0=off)</span>
          <input id="fl" type="number" min="0" max="30" class="mt-0.5 w-full bg-transparent text-lg font-semibold outline-none">
        </label>
      </div>
      <div class="card grid grid-cols-2 gap-2 px-3 py-2.5">
        <label>
          <span class="hint text-[11px]">On warn limit</span>
          <select id="wm" class="mt-0.5 w-full rounded-md bg-black/30 px-2 py-1.5 outline-none">
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
            <option value="kick">Kick</option>
          </select>
        </label>
        <label>
          <span class="hint text-[11px]">On flood</span>
          <select id="fm" class="mt-0.5 w-full rounded-md bg-black/30 px-2 py-1.5 outline-none">
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
            <option value="kick">Kick</option>
            <option value="warn">Warn</option>
          </select>
        </label>
      </div>
    </section>

    <section data-panel="shield" class="panel hidden px-4 space-y-2">
      <div>
        <p class="hint mb-1.5 text-[11px]">Locks</p>
        <div id="locks" class="grid grid-cols-4 gap-1.5"></div>
      </div>
      <div class="card px-3 py-2.5">
        <div class="flex items-center justify-between gap-2">
          <p class="font-medium">Blocklist</p>
          <select id="bm" class="rounded-md bg-black/30 px-2 py-1 text-[12px] outline-none">
            <option value="delete">Delete</option>
            <option value="warn">Warn</option>
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
          </select>
        </div>
        <div id="blocks" class="mt-2 flex flex-wrap gap-1.5"></div>
        <input id="newBlock" type="text" placeholder="Add word · Enter"
          class="mt-2 w-full rounded-md bg-black/30 px-2.5 py-1.5 outline-none placeholder:opacity-40">
      </div>
    </section>

    <section data-panel="people" class="panel hidden px-4 space-y-2">
      <div class="card px-3 py-2.5">
        <p id="trackingTitle" class="hint text-[11px]"></p>
        <p id="trackingCount" class="mt-1 font-medium"></p>
        <p id="trackingScope" class="hint mt-1 text-[12px] leading-4"></p>
        <p id="trackingSaveFirst" class="mt-2 text-[12px] leading-4"></p>
        <button id="trackingStart" type="button" disabled aria-describedby="trackingSaveFirst trackingStatus"
          class="mt-2 w-full rounded-md bg-[var(--tg-theme-button-color,#2481cc)] px-3 py-2 text-[13px] font-medium text-[var(--tg-theme-button-text-color,#fff)] disabled:opacity-40"></button>
        <p id="trackingStatus" role="status" aria-live="polite" class="hidden mt-2 text-[12px] leading-4"></p>
      </div>
      <div id="users" class="card overflow-hidden"></div>
      <div id="userPager" class="flex items-center justify-between text-[12px] hint"></div>
      <div id="detail" class="hidden card px-3 py-2.5 text-[13px] leading-5"></div>
    </section>

    <section data-panel="log" class="panel hidden px-4 space-y-2">
      <div id="logFilters" class="grid grid-cols-4 gap-0.5 rounded-lg bg-black/25 p-0.5 text-[12px]">
        <button type="button" data-log="all" class="logf is-on rounded-md py-1.5">All</button>
        <button type="button" data-log="w" class="logf rounded-md py-1.5 hint">Warns</button>
        <button type="button" data-log="b" class="logf rounded-md py-1.5 hint">Bans</button>
        <button type="button" data-log="m" class="logf rounded-md py-1.5 hint">Mutes</button>
      </div>
      <div id="logList" class="card overflow-hidden"></div>
      <div id="logPager" class="flex items-center justify-between text-[12px] hint"></div>
    </section>
  </div>
  <script>
    const trackingUi = {"title":"Profile tracking","scope":"Initialize known members and current admins. Telegram does not provide a full member list.","count":"{initialized} of {known} known profiles initialized.","start":"Initialize profiles","continue":"Continue initialization","pending":"Requesting…","saveFirst":"Save settings is a separate action.","needPrivate":"Open this Mini App from Telegram to initialize profiles.","failed":"Could not send the request. Please try again."};
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor(tg.themeParams && tg.themeParams.bg_color || '#111111'); }
    const LOCKS = [
      ['url','Link'],['sticker','Sticker'],['gif','GIF'],['photo','Photo'],['video','Video'],
      ['voice','Voice'],['document','File'],['forward','Fwd'],['bot','Bot'],['media','Media'],['command','Cmd'],['channel','Chan']
    ];

    function b64urlDecode(s) {
      s = String(s).replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      const bytes = Uint8Array.from(bin, function (ch) { return ch.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    }
    function chatIdFromUrl() {
      try {
        var params = new URLSearchParams(location.search);
        var c = Number(params.get('c'));
        if (Number.isSafeInteger(c) && c < 0) return c;
        var d = params.get('d') || '';
        if (!d) d = (location.hash || '').replace(/^#/, '');
        if (!d && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) d = tg.initDataUnsafe.start_param;
        if (!d) return null;
        var snap = JSON.parse(b64urlDecode(d));
        if (snap && Number.isSafeInteger(snap.c) && snap.c < 0) return snap.c;
      } catch (e) {}
      return null;
    }
    function haptic() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        haptic();
        var tab = btn.getAttribute('data-tab');
        document.querySelectorAll('[data-tab]').forEach(function (b) {
          b.classList.toggle('is-on', b === btn);
          b.classList.toggle('hint', b !== btn);
        });
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.toggle('hidden', p.getAttribute('data-panel') !== tab);
        });
      });
    });

    const chatId = chatIdFromUrl();
    if (!chatId) {
      document.getElementById('empty').classList.remove('hidden');
    } else {
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('title').textContent = 'Group';
      document.getElementById('chatId').textContent = String(chatId);
      var we = document.getElementById('we');
      we.addEventListener('click', function () {
        haptic();
        we.classList.toggle('on');
        we.setAttribute('aria-pressed', we.classList.contains('on') ? 'true' : 'false');
      });
      var nu = document.getElementById('nu');
      nu.addEventListener('click', function () {
        haptic();
        nu.classList.toggle('on');
        nu.setAttribute('aria-pressed', nu.classList.contains('on') ? 'true' : 'false');
      });

      const lockBox = document.getElementById('locks');
      LOCKS.forEach(function (pair) {
        var t = pair[0], label = pair[1];
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-lock', t);
        b.className = 'lock-tile card px-1 py-2 text-center text-[11px] hint';
        b.textContent = label;
        b.addEventListener('click', function () { haptic(); b.classList.toggle('on'); b.classList.toggle('hint'); });
        lockBox.appendChild(b);
      });

      const blocks = [];
      const blocksEl = document.getElementById('blocks');
      function renderBlocks() {
        blocksEl.innerHTML = '';
        if (!blocks.length) {
          blocksEl.innerHTML = '<p class="hint text-[12px]">Empty</p>';
          return;
        }
        blocks.forEach(function (w, i) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'rounded-full bg-black/35 px-2 py-0.5 text-[12px]';
          pill.textContent = w + ' ×';
          pill.onclick = function () { haptic(); blocks.splice(i, 1); renderBlocks(); };
          blocksEl.appendChild(pill);
        });
      }
      renderBlocks();
      document.getElementById('newBlock').addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var v = e.target.value.trim();
        if (v.length >= 2 && blocks.indexOf(v) < 0) { blocks.push(v); renderBlocks(); }
        e.target.value = '';
      });

      function paginate(items, page, perPage) {
        var list = items || [];
        var pages = Math.max(1, Math.ceil(list.length / perPage));
        var p = Math.min(Math.max(1, page), pages);
        return { page: p, pages: pages, items: list.slice((p - 1) * perPage, p * perPage) };
      }
      function filterActions(rows, type) {
        if (!type || type === 'all') return rows || [];
        return (rows || []).filter(function (row) { return row && row.t === type; });
      }
      function renderPager(el, state, onPage) {
        el.innerHTML = '';
        if (state.pages <= 1) return;
        var prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'rounded px-2 py-0.5';
        prev.textContent = 'Prev';
        prev.disabled = state.page <= 1;
        prev.onclick = function () { haptic(); onPage(state.page - 1); };
        var info = document.createElement('span');
        info.textContent = state.page + '/' + state.pages;
        var next = document.createElement('button');
        next.type = 'button';
        next.className = 'rounded px-2 py-0.5';
        next.textContent = 'Next';
        next.disabled = state.page >= state.pages;
        next.onclick = function () { haptic(); onPage(state.page + 1); };
        el.appendChild(prev);
        el.appendChild(info);
        el.appendChild(next);
      }

      const usersEl = document.getElementById('users');
      const detail = document.getElementById('detail');
      var people = [];
      var actions = [];
      var tracking = {};
      var userPage = 1;
      function renderPeople() {
        usersEl.innerHTML = '';
        if (!people.length) {
          usersEl.innerHTML = '<p class="hint px-3 py-6 text-center">No members cached.</p>';
          document.getElementById('userPager').innerHTML = '';
          return;
        }
        var page = paginate(people, userPage, 8);
        userPage = page.page;
        page.items.forEach(function (u, idx) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'flex w-full items-center gap-2 px-3 py-2 text-left ' + (idx ? 'border-t border-white/5' : '');
          row.innerHTML = '<span class="min-w-0 flex-1 truncate">' + esc(u.n || u.i) + '</span><span class="hint text-[11px]">' + esc(u.k || 0) + '</span>';
          row.onclick = function () {
            haptic();
            detail.classList.remove('hidden');
            detail.innerHTML = '<p class="font-medium">' + esc(u.n || '') + '</p><p class="hint">id ' + esc(u.i) + ' · ' + (u.u ? '@' + esc(u.u) : 'no username') + ' · warns ' + esc(u.k || 0) + '</p>';
          };
          usersEl.appendChild(row);
        });
        renderPager(document.getElementById('userPager'), page, function (p) { userPage = p; renderPeople(); });
      }
      renderPeople();

      var logFilter = 'all';
      var logPage = 1;
      var LABELS = { w: 'Warn', b: 'Ban', m: 'Mute', k: 'Kick', u: 'Unban', n: 'Unmute' };
      function renderLog() {
        var rows = filterActions(actions, logFilter);
        var page = paginate(rows, logPage, 8);
        logPage = page.page;
        var box = document.getElementById('logList');
        box.innerHTML = '';
        if (!page.items.length) {
          box.innerHTML = '<p class="hint px-3 py-6 text-center">Empty</p>';
        } else {
          page.items.forEach(function (a, idx) {
            var row = document.createElement('div');
            row.className = 'flex items-baseline justify-between gap-2 px-3 py-2 ' + (idx ? 'border-t border-white/5' : '');
            row.innerHTML = '<p class="min-w-0 truncate">' + esc(a.n || a.i) + '</p><p class="hint shrink-0 text-[11px]">' + esc(LABELS[a.t] || a.t) + '</p>';
            box.appendChild(row);
          });
        }
        renderPager(document.getElementById('logPager'), page, function (p) { logPage = p; renderLog(); });
      }
      document.querySelectorAll('[data-log]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          haptic();
          logFilter = btn.getAttribute('data-log');
          logPage = 1;
          document.querySelectorAll('[data-log]').forEach(function (b) {
            b.classList.toggle('is-on', b === btn);
            b.classList.toggle('hint', b !== btn);
          });
          renderLog();
        });
      });
      renderLog();

      function collect() {
        const L = [];
        lockBox.querySelectorAll('[data-lock]').forEach(function (el) {
          if (el.classList.contains('on')) L.push(el.getAttribute('data-lock'));
        });
        var wl = Number(document.getElementById('wl').value);
        if (!(wl >= 1 && wl <= 50)) wl = 3;
        var fl = Number(document.getElementById('fl').value);
        if (fl === 1) fl = 2;
        if (!(fl >= 0 && fl <= 30)) fl = 0;
        return {
          c: chatId,
          we: we.classList.contains('on'),
          nu: nu.classList.contains('on'),
          wt: String(document.getElementById('wt').value || '').slice(0, 4096),
          wl: wl,
          wm: document.getElementById('wm').value,
          fl: fl,
          fm: document.getElementById('fm').value,
          bm: document.getElementById('bm').value,
          L: L,
          B: blocks.slice(0, 32),
        };
      }
      var canHttp = Boolean(tg && tg.initData);
      var ready = false;
      var trackingStart = document.getElementById('trackingStart');
      var trackingStatus = document.getElementById('trackingStatus');
      var trackingLabel = trackingUi.start;
      var apiBase = (typeof location !== 'undefined' && location.hostname && location.hostname.indexOf('workers.dev') >= 0)
        ? '' : 'https://vippro-rose.n5pskgzs9g.workers.dev';
      function postSave(payload) {
        return fetch(apiBase + '/api/app/save', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'authorization': 'tma ' + (tg.initData || ''),
            'x-telegram-init-data': tg.initData || '',
          },
          body: JSON.stringify(payload),
        }).then(function (res) { return res.json(); });
      }
      function setTracking(t) {
        tracking = t || {};
        trackingLabel = tracking.after ? trackingUi.continue : trackingUi.start;
        document.getElementById('trackingCount').textContent = trackingUi.count
          .replace('{initialized}', tracking.initialized || 0).replace('{known}', tracking.known || 0);
        trackingStart.textContent = trackingLabel;
        trackingStart.disabled = !canHttp;
      }
      document.getElementById('trackingTitle').textContent = trackingUi.title;
      document.getElementById('trackingScope').textContent = trackingUi.scope;
      document.getElementById('trackingSaveFirst').textContent = trackingUi.saveFirst;
      setTracking({});
      if (!canHttp) {
        trackingStatus.textContent = trackingUi.needPrivate;
        trackingStatus.classList.remove('hidden');
      }
      trackingStart.addEventListener('click', function () {
        if (!canHttp || trackingStart.disabled) return;
        haptic();
        trackingStart.disabled = true;
        trackingStart.textContent = trackingUi.pending;
        trackingStatus.classList.toggle('hidden', true);
        var payload = { c: chatId, action: 'sync_members', after: tracking.after || 0 };
        postSave(payload).then(function (body) {
          trackingStart.disabled = false;
          trackingStart.textContent = trackingLabel;
          if (body && body.ok && tg.showAlert) tg.showAlert('Profiles updated');
          else {
            trackingStatus.textContent = trackingUi.failed;
            trackingStatus.classList.remove('hidden');
          }
        }).catch(function () {
          trackingStart.disabled = false;
          trackingStart.textContent = trackingLabel;
          trackingStatus.textContent = trackingUi.failed;
          trackingStatus.classList.remove('hidden');
        });
      });
      if (tg && tg.MainButton) {
        tg.MainButton.setText('Save');
        if (tg.MainButton.hide) tg.MainButton.hide();
        tg.MainButton.onClick(function () {
          haptic();
          if (!canHttp || !ready) {
            if (tg.showAlert) tg.showAlert('Save failed');
            return;
          }
          postSave(collect()).then(function (body) {
            if (body && body.ok && body.snap) hydrate(body.snap);
            if (tg.showAlert) tg.showAlert(body && body.ok ? 'Saved' : ('Save failed' + (body && body.error ? ': ' + body.error : '')));
          }).catch(function () {
            if (tg.showAlert) tg.showAlert('Save failed');
          });
        });
      }
      function hydrate(s) {
        if (!s) return;
        document.getElementById('title').textContent = s.t || 'Group';
        we.classList.toggle('on', !!s.we);
        we.setAttribute('aria-pressed', s.we ? 'true' : 'false');
        nu.classList.toggle('on', !!s.nu);
        nu.setAttribute('aria-pressed', s.nu ? 'true' : 'false');
        document.getElementById('wt').value = s.wt || '';
        document.getElementById('wl').value = s.wl || 3;
        document.getElementById('wm').value = s.wm || 'mute';
        document.getElementById('fl').value = s.fl || 0;
        document.getElementById('fm').value = s.fm || 'mute';
        document.getElementById('bm').value = s.bm || 'delete';
        var liveLocks = new Set(s.L || []);
        lockBox.querySelectorAll('[data-lock]').forEach(function (el) {
          var on = liveLocks.has(el.getAttribute('data-lock'));
          el.classList.toggle('on', on);
          el.classList.toggle('hint', !on);
        });
        blocks.length = 0;
        (s.B || []).forEach(function (w) { blocks.push(w); });
        renderBlocks();
        people = s.U || [];
        userPage = 1;
        renderPeople();
        actions = s.A || [];
        logPage = 1;
        renderLog();
        setTracking(s.T || {});
      }
      if (canHttp) {
        fetch(apiBase + '/api/app/state?c=' + encodeURIComponent(chatId), {
          headers: {
            authorization: 'tma ' + (tg.initData || ''),
            'x-telegram-init-data': tg.initData || '',
          },
        }).then(function (res) { return res.json(); }).then(function (body) {
          if (body && body.ok && body.snap) {
            ready = true;
            hydrate(body.snap);
            if (tg && tg.MainButton && tg.MainButton.show) tg.MainButton.show();
          }
        }).catch(function () {});
      }
    }
  </script>
</body>
</html>
