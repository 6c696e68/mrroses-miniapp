<body class="rose-bg min-h-screen font-sans antialiased pb-28">
  <div id="empty" class="hidden px-6 pt-16 text-center">
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full border border-amber-300/30 bg-amber-300/10 text-2xl">✦</div>
    <h1 class="font-display text-3xl text-amber-100">ROSES</h1>
    <p class="mt-3 text-sm leading-6 text-stone-400">No group data yet.<br>In a group (admin), send <span class="text-amber-200">/app</span> then tap <span class="text-amber-200">Open app</span>.</p>
  </div>

  <div id="app" class="hidden">
    <header class="px-5 pt-6 pb-4">
      <p class="text-[11px] tracking-[0.28em] text-amber-300/80 uppercase">Control room</p>
      <h1 id="title" class="mt-1 font-display text-[28px] leading-tight text-amber-50">Group control</h1>
      <p id="chatId" class="mt-1 text-xs text-stone-500"></p>
    </header>

    <nav class="mx-5 mb-4 grid grid-cols-4 rounded-2xl border border-amber-200/10 bg-black/30 p-1 text-[11px] font-medium">
      <button data-tab="overview" class="tab on rounded-xl py-2.5 text-black bg-gradient-to-r from-amber-200 to-amber-400">Home</button>
      <button data-tab="shield" class="tab rounded-xl py-2.5 text-stone-400">Shield</button>
      <button data-tab="people" class="tab rounded-xl py-2.5 text-stone-400">People</button>
      <button data-tab="log" class="tab rounded-xl py-2.5 text-stone-400">Log</button>
    </nav>

    <section data-panel="overview" class="panel px-5 space-y-4">
      <div class="rounded-3xl border border-amber-200/10 bg-white/5 p-4 backdrop-blur">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-[11px] uppercase tracking-widest text-stone-500">Welcome</p>
            <p class="mt-1 text-base font-medium">Welcome new members</p>
          </div>
          <button id="we" type="button" class="toggle" aria-pressed="false"></button>
        </div>
        <textarea id="wt" rows="3" placeholder="Hi {mention}, welcome to {chatname}."
          class="mt-4 w-full resize-none rounded-2xl border border-white/5 bg-black/40 px-4 py-3 text-sm text-amber-50 placeholder:text-stone-600 outline-none focus:border-amber-300/40"></textarea>
        <p class="mt-2 text-[11px] text-stone-500">{mention} {first} {chatname} {count}</p>
      </div>

      <div class="rounded-3xl border border-amber-200/10 bg-white/5 p-4">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-[11px] uppercase tracking-widest text-stone-500">Username</p>
            <p class="mt-1 text-base font-medium">Mute joins with no @username</p>
          </div>
          <button id="nu" type="button" class="toggle" aria-pressed="false"></button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <label class="rounded-3xl border border-amber-200/10 bg-white/5 p-4">
          <span class="text-[11px] uppercase tracking-widest text-stone-500">Warn limit</span>
          <input id="wl" type="number" min="1" max="50" class="mt-2 w-full bg-transparent text-2xl font-display text-amber-100 outline-none">
        </label>
        <label class="rounded-3xl border border-amber-200/10 bg-white/5 p-4">
          <span class="text-[11px] uppercase tracking-widest text-stone-500">Flood</span>
          <input id="fl" type="number" min="0" max="30" class="mt-2 w-full bg-transparent text-2xl font-display text-amber-100 outline-none">
        </label>
      </div>

      <div class="rounded-3xl border border-amber-200/10 bg-white/5 p-4 space-y-3">
        <label class="block">
          <span class="text-[11px] uppercase tracking-widest text-stone-500">When warn limit is hit</span>
          <select id="wm" class="mt-2 w-full rounded-xl bg-black/40 px-3 py-2.5 text-sm outline-none">
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
            <option value="kick">Kick</option>
          </select>
        </label>
        <label class="block">
          <span class="text-[11px] uppercase tracking-widest text-stone-500">On flood</span>
          <select id="fm" class="mt-2 w-full rounded-xl bg-black/40 px-3 py-2.5 text-sm outline-none">
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
            <option value="kick">Kick</option>
            <option value="warn">Warn</option>
          </select>
        </label>
      </div>
    </section>

    <section data-panel="shield" class="panel hidden px-5 space-y-4">
      <div>
        <p class="mb-2 text-[11px] uppercase tracking-widest text-stone-500">Content locks</p>
        <div id="locks" class="grid grid-cols-3 gap-2"></div>
      </div>
      <div class="rounded-3xl border border-amber-200/10 bg-white/5 p-4">
        <div class="flex items-center justify-between">
          <p class="text-[11px] uppercase tracking-widest text-stone-500">Blocklist</p>
          <select id="bm" class="rounded-lg bg-black/40 px-2 py-1 text-xs outline-none">
            <option value="delete">Delete</option>
            <option value="warn">Warn</option>
            <option value="mute">Mute</option>
            <option value="ban">Ban</option>
          </select>
        </div>
        <div id="blocks" class="mt-3 flex flex-wrap gap-2"></div>
        <input id="newBlock" type="text" placeholder="Add word · Enter"
          class="mt-3 w-full rounded-xl border border-white/5 bg-black/40 px-3 py-2.5 text-sm outline-none placeholder:text-stone-600">
      </div>
    </section>

    <section data-panel="people" class="panel hidden px-5">
      <div id="users" class="overflow-hidden rounded-3xl border border-amber-200/10 bg-white/5"></div>
      <div id="userPager" class="mt-3 flex items-center justify-between text-xs text-stone-500"></div>
      <div id="detail" class="mt-3 hidden rounded-3xl border border-amber-200/20 bg-amber-300/5 p-4 text-sm leading-7 text-amber-50"></div>
    </section>

    <section data-panel="log" class="panel hidden px-5 space-y-3">
      <div id="logFilters" class="grid grid-cols-4 gap-1 rounded-2xl border border-amber-200/10 bg-black/30 p-1 text-[11px]">
        <button type="button" data-log="all" class="logf on rounded-xl py-2 text-black bg-gradient-to-r from-amber-200 to-amber-400">All</button>
        <button type="button" data-log="w" class="logf rounded-xl py-2 text-stone-400">Warns</button>
        <button type="button" data-log="b" class="logf rounded-xl py-2 text-stone-400">Bans</button>
        <button type="button" data-log="m" class="logf rounded-xl py-2 text-stone-400">Mutes</button>
      </div>
      <div id="logList" class="overflow-hidden rounded-3xl border border-amber-200/10 bg-white/5"></div>
      <div id="logPager" class="flex items-center justify-between text-xs text-stone-500"></div>
    </section>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#070709'); }
    const LOCKS = [
      ['url','Link'],['sticker','Sticker'],['gif','GIF'],['photo','Photo'],['video','Video'],
      ['voice','Voice'],['document','File'],['forward','Forward'],['bot','Bot'],['media','Media'],['command','Command'],['channel','Channel']
    ];

    function b64urlDecode(s) {
      s = String(s).replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      const bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    }
    function loadSnap() {
      var d = '';
      try { d = new URLSearchParams(location.search).get('d') || ''; } catch (e) {}
      if (!d) d = (location.hash || '').replace(/^#/, '');
      if (!d && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) d = tg.initDataUnsafe.start_param;
      if (!d) return null;
      try { return JSON.parse(b64urlDecode(d)); } catch (e) { return null; }
    }
    function haptic() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }

    document.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        haptic();
        var tab = btn.getAttribute('data-tab');
        document.querySelectorAll('[data-tab]').forEach(function (b) {
          b.className = 'tab rounded-xl py-2.5 text-stone-400';
        });
        btn.className = 'tab on rounded-xl py-2.5 text-black bg-gradient-to-r from-amber-200 to-amber-400';
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.toggle('hidden', p.getAttribute('data-panel') !== tab);
        });
      });
    });

    const snap = loadSnap();
    if (!snap || typeof snap.c !== 'number') {
      document.getElementById('empty').classList.remove('hidden');
    } else {
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('title').textContent = snap.t || 'Group control';
      document.getElementById('chatId').textContent = 'ID ' + snap.c;
      var we = document.getElementById('we');
      we.classList.toggle('on', !!snap.we);
      we.setAttribute('aria-pressed', snap.we ? 'true' : 'false');
      we.addEventListener('click', function () {
        haptic();
        we.classList.toggle('on');
        we.setAttribute('aria-pressed', we.classList.contains('on') ? 'true' : 'false');
      });
      var nu = document.getElementById('nu');
      nu.classList.toggle('on', !!snap.nu);
      nu.setAttribute('aria-pressed', snap.nu ? 'true' : 'false');
      nu.addEventListener('click', function () {
        haptic();
        nu.classList.toggle('on');
        nu.setAttribute('aria-pressed', nu.classList.contains('on') ? 'true' : 'false');
      });
      document.getElementById('wt').value = snap.wt || '';
      document.getElementById('wl').value = snap.wl || 3;
      document.getElementById('wm').value = snap.wm || 'mute';
      document.getElementById('fl').value = snap.fl || 0;
      document.getElementById('fm').value = snap.fm || 'mute';
      document.getElementById('bm').value = snap.bm || 'delete';

      const lockBox = document.getElementById('locks');
      const selected = new Set(snap.L || []);
      LOCKS.forEach(function (pair) {
        var t = pair[0], label = pair[1];
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-lock', t);
        b.className = 'lock-tile rounded-2xl border border-white/10 bg-black/30 px-2 py-3 text-center text-[11px] text-stone-300' + (selected.has(t) ? ' on' : '');
        b.textContent = label;
        b.addEventListener('click', function () { haptic(); b.classList.toggle('on'); });
        lockBox.appendChild(b);
      });

      const blocks = Array.isArray(snap.B) ? snap.B.slice() : [];
      const blocksEl = document.getElementById('blocks');
      function renderBlocks() {
        blocksEl.innerHTML = '';
        if (!blocks.length) {
          blocksEl.innerHTML = '<p class="text-xs text-stone-500">No blocked words yet.</p>';
          return;
        }
        blocks.forEach(function (w, i) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'rounded-full border border-amber-200/20 bg-black/40 px-3 py-1 text-xs text-amber-100';
          pill.textContent = w + '  ×';
          pill.onclick = function () { haptic(); blocks.splice(i, 1); renderBlocks(); };
          blocksEl.appendChild(pill);
        });
      }
      renderBlocks();
      document.getElementById('newBlock').addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var v = e.target.value.trim();
        if (v.length >= 2 && blocks.indexOf(v) < 0) { blocks.push(v); renderBlocks(); }
        e.target.value = '';
      });

      function paginate(items, page, perPage) {
        var list = items || [];
        var pages = Math.max(1, Math.ceil(list.length / perPage));
        var p = Math.min(Math.max(1, page), pages);
        return { page: p, pages: pages, items: list.slice((p - 1) * perPage, p * perPage) };
      }
      function filterActions(rows, type) {
        if (!type || type === 'all') return rows || [];
        return (rows || []).filter(function (row) { return row && row.t === type; });
      }
      function renderPager(el, state, onPage) {
        el.innerHTML = '';
        if (state.pages <= 1) {
          el.textContent = state.items.length ? '' : '';
          return;
        }
        var prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'rounded-lg border border-white/10 px-3 py-1';
        prev.textContent = 'Prev';
        prev.disabled = state.page <= 1;
        prev.onclick = function () { haptic(); onPage(state.page - 1); };
        var info = document.createElement('span');
        info.textContent = state.page + ' / ' + state.pages;
        var next = document.createElement('button');
        next.type = 'button';
        next.className = 'rounded-lg border border-white/10 px-3 py-1';
        next.textContent = 'Next';
        next.disabled = state.page >= state.pages;
        next.onclick = function () { haptic(); onPage(state.page + 1); };
        el.appendChild(prev);
        el.appendChild(info);
        el.appendChild(next);
      }

      const usersEl = document.getElementById('users');
      const detail = document.getElementById('detail');
      var people = snap.U || [];
      var userPage = 1;
      function renderPeople() {
        usersEl.innerHTML = '';
        if (!people.length) {
          usersEl.innerHTML = '<p class="px-4 py-8 text-center text-sm text-stone-500">No members in memory yet.</p>';
          document.getElementById('userPager').innerHTML = '';
          return;
        }
        var page = paginate(people, userPage, 6);
        userPage = page.page;
        page.items.forEach(function (u, idx) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'flex w-full items-center gap-3 px-4 py-3 text-left ' + (idx ? 'border-t border-white/5' : '');
          var ini = String(u.n || u.i).slice(0, 1).toUpperCase();
          row.innerHTML = '<span class="flex h-9 w-9 items-center justify-center rounded-full bg-amber-300/15 text-sm text-amber-200">' + ini + '</span><span class="flex-1"><span class="block text-sm">' + String(u.n || u.i).replace(/</g,'&lt;') + '</span><span class="block text-[11px] text-stone-500">' + u.i + '</span></span><span class="rounded-full bg-black/40 px-2 py-0.5 text-[11px] text-amber-200">' + (u.k || 0) + '</span>';
          row.onclick = function () {
            haptic();
            detail.classList.remove('hidden');
            detail.innerHTML = '<p class="text-[11px] uppercase tracking-widest text-amber-300/70">Profile</p><p class="mt-1 font-display text-xl">' + String(u.n || '').replace(/</g,'&lt;') + '</p><p>Id · <span class="text-amber-200">' + u.i + '</span></p><p>Username · ' + (u.u ? '@' + u.u : 'none') + '</p><p>Warns · ' + (u.k || 0) + '</p>';
          };
          usersEl.appendChild(row);
        });
        renderPager(document.getElementById('userPager'), page, function (p) { userPage = p; renderPeople(); });
      }
      renderPeople();

      var logFilter = 'all';
      var logPage = 1;
      var LABELS = { w: 'Warn', b: 'Ban', m: 'Mute', k: 'Kick', u: 'Unban', n: 'Unmute' };
      function renderLog() {
        var rows = filterActions(snap.A || [], logFilter);
        var page = paginate(rows, logPage, 6);
        logPage = page.page;
        var box = document.getElementById('logList');
        box.innerHTML = '';
        if (!page.items.length) {
          box.innerHTML = '<p class="px-4 py-8 text-center text-sm text-stone-500">No ' + (logFilter === 'all' ? 'actions' : LABELS[logFilter] || 'items') + ' yet.</p>';
        } else {
          page.items.forEach(function (a, idx) {
            var row = document.createElement('div');
            row.className = 'px-4 py-3 ' + (idx ? 'border-t border-white/5' : '');
            row.innerHTML = '<p class="text-[11px] uppercase tracking-widest text-amber-300/70">' + (LABELS[a.t] || a.t) + '</p><p class="mt-1 text-sm">' + String(a.n || a.i).replace(/</g,'&lt;') + '</p><p class="text-[11px] text-stone-500">' + (a.r ? String(a.r).replace(/</g,'&lt;') : 'id ' + a.i) + '</p>';
            box.appendChild(row);
          });
        }
        renderPager(document.getElementById('logPager'), page, function (p) { logPage = p; renderLog(); });
      }
      document.querySelectorAll('[data-log]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          haptic();
          logFilter = btn.getAttribute('data-log');
          logPage = 1;
          document.querySelectorAll('[data-log]').forEach(function (b) {
            b.className = 'logf rounded-xl py-2 text-stone-400';
          });
          btn.className = 'logf on rounded-xl py-2 text-black bg-gradient-to-r from-amber-200 to-amber-400';
          renderLog();
        });
      });
      renderLog();

      function collect() {
        const L = [];
        lockBox.querySelectorAll('[data-lock]').forEach(function (el) {
          if (el.classList.contains('on')) L.push(el.getAttribute('data-lock'));
        });
        return {
          c: snap.c,
          we: we.classList.contains('on'),
          nu: nu.classList.contains('on'),
          wt: document.getElementById('wt').value,
          wl: Number(document.getElementById('wl').value),
          wm: document.getElementById('wm').value,
          fl: Number(document.getElementById('fl').value),
          fm: document.getElementById('fm').value,
          bm: document.getElementById('bm').value,
          L: L,
          B: blocks
        };
      }
      if (tg && tg.MainButton) {
        tg.MainButton.setText('Save settings');
        tg.MainButton.show();
        tg.MainButton.onClick(function () {
          haptic();
          tg.sendData(JSON.stringify(collect()));
        });
      }
    }
  </script>
</body>
</html>
